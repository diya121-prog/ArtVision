technique_map:
  Early_Renaissance:
    medium: "Egg tempera on wood panel & fresco"
    method: "Linear perspective, precise underdrawing, gold leaf gilding"
  High_Renaissance:
    medium: "Oil & tempera grassa on panel / canvas"
    method: "Sfumato blending, chiaroscuro modulation, anatomical drafting"
  Mannerism_Late_Renaissance:
    medium: "Oil on primed panel / canvas"
    method: "Elongated proportions, complex figura serpentinata, stylized palettes"
  Northern_Renaissance:
    medium: "Glazed oil painting on oak panel"
    method: "Luminous multi-layered oil glazes, microscopic surface realism"
  Baroque:
    medium: "Oil on canvas"
    method: "Tenebrism, dramatic directional lighting, bold impasto highlights"
  Rococo:
    medium: "Oil on canvas / pastel"
    method: "Sinuous rocaille brushwork, delicate pastel tones, atmospheric glaze"
  Romanticism:
    medium: "Oil on canvas / watercolor"
    method: "Expressive atmospheric washes, dramatic scumbling, emotive brushwork"
  Realism:
    medium: "Oil on canvas"
    method: "Direct tonal painting (alla prima), earthy mineral pigments, textural truth"
  Contemporary_Realism:
    medium: "Oil / acrylic on canvas"
    method: "Direct observation, photographic acuity, blended optical realism"
  New_Realism:
    medium: "Mixed media, assemblage, collage"
    method: "Direct appropriation of everyday objects, industrial materials"
  Impressionism:
    medium: "Oil on primed canvas (plein-air)"
    method: "Broken brushstrokes, unblended pure pigment, transient optical mixing"
  Post_Impressionism:
    medium: "Oil on canvas"
    method: "Structural brushwork, saturated emotive color planes, symbolic form"
  Pointillism:
    medium: "Oil on canvas"
    method: "Divisionist optical dotting, systematic chromatic theory application"
  Symbolism:
    medium: "Oil, gouache, and pastel on canvas/board"
    method: "Dreamlike veil glazes, decorative flat patterning, evocative outlines"
  Art_Nouveau:
    medium: "Oil, watercolor, and lithographic ink"
    method: "Curvilinear sinuous whiplash contours, flat ornamental design"
  Fauvism:
    medium: "Oil on canvas"
    method: "Wild non-naturalistic color liberation, raw unmixed impasto strokes"
  Expressionism:
    medium: "Oil and gouache on coarse canvas"
    method: "Distorted violent brushmarks, high-contrast emotional pigment application"
  Cubism:
    medium: "Oil on canvas, papier collé"
    method: "Deconstructed spatial facets, multi-perspective flattening, collage elements"
  Analytical_Cubism:
    medium: "Monochrome oil on canvas"
    method: "Subdued earth-tone faceted planes, interwoven geometric grid"
  Synthetic_Cubism:
    medium: "Oil, charcoal, pasted newsprint, sandpaper"
    method: "Flat bright shapes, trompe l'œil textures, multi-media collage"
  Naive_Art_Primitivism:
    medium: "Oil on board / canvas"
    method: "Simplified non-academic flat perspective, bright local color, decorative detail"
  Abstract_Expressionism:
    medium: "Enamel, house paint, oil on raw cotton duck"
    method: "All-over composition, unstretched canvas handling, dynamic physical gesture"
  Action_painting:
    medium: "Industrial liquid paint / enamel on canvas"
    method: "Dripping, pouring, splashing, spontaneous kinetic mark-making"
  Color_Field_Painting:
    medium: "Diluted acrylic stain / oil on unprimed canvas"
    method: "Monolithic color soak-staining, edge-to-edge chromatic immersion"
  Minimalism:
    medium: "Industrial acrylic, oil, metallic enamel"
    method: "Geometric reduction, monochrome flat fields, objective elimination of artist touch"
  Pop_Art:
    medium: "Silkscreen ink, acrylic, and synthetic polymer"
    method: "Commercial screenprinting, Ben-Day dot emulation, crisp hard edges"
  Ukiyo_e:
    medium: "Multicolor woodblock print (Nishiki-e) & sumi ink"
    method: "Carved cherry wood matrices, baren hand-burnishing, bokashi color gradation"



