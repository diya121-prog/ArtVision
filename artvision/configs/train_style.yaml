data:
  batch_size: 32
  image_dir: data/processed/images
  image_size: 224
  metadata_path: data/processed/metadata.csv
  num_workers: 4
  test_split: test
  train_split: train
  val_split: val
model:
  backbone: efficientnet_b0
  num_classes: 10
  pretrained: true
training:
  device: mps
  early_stopping_patience: 5
  epochs_stage1: 5
  epochs_stage2: 15
  label_smoothing: 0.1
  lr_backbone: 1.0e-05
  lr_head: 0.001
  output_dir: runs/style_model
  seed: 42
  weight_decay: 0.01
